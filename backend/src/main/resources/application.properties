spring.application.name=clinic-appointment-backend

# Loads application-local.properties (gitignored) by default, so plain
# `mvn spring-boot:run` picks up your Atlas connection string without extra flags.
# Deployments (Docker/CI) should override this via SPRING_PROFILES_ACTIVE instead.
spring.profiles.active=local

spring.mongodb.uri=${SPRING_MONGODB_URI:mongodb://localhost:27017/clinic_appointment_db}
spring.data.mongodb.auto-index-creation=true

# Demo JWT settings - classroom use only, keep secrets outside source code in real projects
app.jwt.secret=${JWT_SECRET:capstone-demo-secret-key-change-me-minimum-32-characters-2026}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
